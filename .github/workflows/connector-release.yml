name: Build & Release VillaSafe WhatsApp Connector

# The connector's Windows app (whatsapp-connector/) is released on its own
# tags, connector-vX.Y.Z, and never marked "latest", so the Gate Bridge's
# releases/latest/download links keep pointing at the bridge.

on:
  push:
    tags:
      - 'connector-v*'
  workflow_dispatch:

jobs:
  build:
    name: Build for Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: whatsapp-connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm install
      - name: Build installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win -- --publish never
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: connector-windows
          path: whatsapp-connector/release/*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/connector-v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: VillaSafe WhatsApp Connector ${{ github.ref_name }}
          files: artifacts/**/*
          make_latest: false
          body: |
            Windows app that keeps VillaSafe's WhatsApp number linked to the communications inbox.
            Download it from VillaSafe → Platform overview → WhatsApp connector (super admin),
            install it on an always-on computer (no admin rights needed), and paste the setup key once.
            It starts with Windows, runs in the background, and reconnects by itself.
